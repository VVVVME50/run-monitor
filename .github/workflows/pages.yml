# Publishes the page and its encrypted status on each push. A workflow, not a branch build: branch builds are held to
# about ten an hour, and the status is pushed every two minutes. Only the page's own files are published.
name: pages
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp index.html status.enc .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # GitHub at times cannot find the artifact it was just given ("No artifacts named github-pages"): try once more
      # after a pause, and if that fails too, warn and leave it to the next push (two minutes later) instead of failing.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - id: again
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure' && steps.again.outcome == 'failure'
        run: echo "::warning::deploying failed twice; the next push deploys again"
